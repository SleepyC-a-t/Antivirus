name: SentinelGuard security incident — OS process trace (review only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/sentinelguard-v43-process-forensics.yml"
      - "ci/v43_*"
      - "SentinelLite_Source/SentinelLite/src/launch_metadata_windows.go"
      - "SentinelLite_Source/SentinelLite/src/v42_structured_analyzers.go"
permissions:
  contents: read
jobs:
  windows-os-trace:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out reviewed patched head
        uses: actions/checkout@v4
        with:
          path: patched
      - name: Check out known affected historical release
        uses: actions/checkout@v4
        with:
          repository: SleepyC-a-t/Antivirus
          ref: c1770d9dba6ba57604e89526e29f545bf293589d
          path: old
      - uses: actions/setup-go@v5
        with:
          go-version-file: patched/SentinelLite_Source/SentinelLite/src/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm trusted Windows OS and instrumentation only
        run: |
          Write-Host "Old=$((git -C old rev-parse HEAD))"
          Write-Host "Patched=$((git -C patched rev-parse HEAD))"
          # No downloaded malware, no Defender disabling, no external EXEs run.
          & patched/ci/v43_trace.ps1 -Baseline "$PWD/old" -Patched "$PWD/patched" -Output "$PWD/process-forensics"
      - name: Upload ETW data, decoded events, commands (if present), and counters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SentinelGuard-Process-Forensics-REVIEW-ONLY
          path: process-forensics/
          retention-days: 30
          if-no-files-found: warn

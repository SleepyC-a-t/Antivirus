name: SentinelGuard Active preview — Windows validation
on:
  pull_request:
    paths:
      - '.github/workflows/sentinelguard-active.yml'
      - 'SentinelLite_Source/**'
      - 'Active_Edition/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-windows:
    name: Test Active edition and build Windows executable
    runs-on: windows-latest
    timeout-minutes: 16
    defaults:
      run:
        shell: pwsh
        working-directory: SentinelLite_Source/SentinelLite/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: SentinelLite_Source/SentinelLite/src/go.mod
          cache: false
      - name: Static analysis
        run: go vet ./...
      - name: Active monitor, security and regression tests
        run: go test -count=1 -v ./...
      - name: Build SentinelGuard Active (separate edition)
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'SentinelGuard-Active.exe'
          go build -trimpath -ldflags '-s -w -H windowsgui -X main.edition=active' -o $exe .
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $exe)) { throw 'Active executable build failed' }
          Get-FileHash -Algorithm SHA256 $exe | Format-List
      - name: Launch and validate localhost access control
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'SentinelGuard-Active.exe'
          $proc = Start-Process -FilePath $exe -WorkingDirectory $env:RUNNER_TEMP -PassThru
          try {
            $ready = $false
            for ($i=0;$i -lt 20;$i++) {
              Start-Sleep -Seconds 1
              $proc.Refresh()
              if ($proc.HasExited) { throw 'Active edition exited unexpectedly' }
              $socket = Get-NetTCPConnection -State Listen -OwningProcess $proc.Id -ErrorAction SilentlyContinue |
                Where-Object { $_.LocalAddress -eq '127.0.0.1' } | Select-Object -First 1
              if ($null -ne $socket) {
                $url = "http://127.0.0.1:$($socket.LocalPort)/api/active/status"
                $response = Invoke-WebRequest -Uri $url -SkipHttpErrorCheck -TimeoutSec 5
                if ($response.StatusCode -ne 403) { throw "Unauthenticated Active API returned $($response.StatusCode)" }
                $ready = $true
                break
              }
            }
            if (-not $ready) { throw 'Active edition did not start a loopback-only server' }
            Write-Host 'PASS: Active edition startup and authenticated local API protection'
          } finally {Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}
      - name: Validate browser extension assets
        shell: pwsh
        working-directory: Active_Edition/browser-extension
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.json','utf8')); if(m.manifest_version!==3 || !m.permissions.includes('declarativeNetRequest')) process.exit(1);"
          node --check background.js
          node --check popup.js
      - name: Create Active edition artifact
        shell: pwsh
        working-directory: .
        run: |
          $pack = Join-Path $env:RUNNER_TEMP 'SentinelGuard-Active-Preview'
          New-Item -ItemType Directory -Force -Path $pack | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'SentinelGuard-Active.exe') $pack
          Copy-Item -Recurse (Join-Path $env:GITHUB_WORKSPACE 'Active_Edition/browser-extension') (Join-Path $pack 'browser-extension')
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'Active_Edition/README.md') (Join-Path $pack 'README.md')
      - uses: actions/upload-artifact@v4
        with:
          name: SentinelGuard-Active-Preview-Windows
          path: ${{ runner.temp }}/SentinelGuard-Active-Preview/
          if-no-files-found: error
          retention-days: 14

  active-race:
    name: Race-test Active monitor and browser authentication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: SentinelLite_Source/SentinelLite/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: SentinelLite_Source/SentinelLite/src/go.mod
          cache: false
      - run: go test -race -count=1 -run '^Test(Active|StandardEdition)' ./...

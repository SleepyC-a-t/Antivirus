name: Stage 12 source transfer for isolated local regression work
on:
  push:
    branches: [stage12-stability-telemetry-detection]
    paths: ['.github/workflows/stage12-source-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: stage12-source-snapshot
          path: |
            SentinelLite_Source/SentinelLite/src/**
            .github/workflows/sentinellite-windows.yml
            SentinelLite_Source/README.txt
          retention-days: 1
